services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # No host port: only the api service needs MongoDB. Uncomment to poke around:
    # ports: ["27017:27017"]

  ocr-service:
    build: ./ocr-service
    restart: unless-stopped
    environment:
      # mock = deterministic canned output (demo without a real QID photo).
      # paddle = real PaddleOCR; first call downloads models at runtime.
      OCR_MODE: ${OCR_MODE:-mock}
      OCR_LANG: en
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__Database: identity_documents
      Ocr__BaseUrl: http://ocr-service:8000
      Storage__RootPath: /data/uploads
      ApiKey: ${API_KEY:-dev-api-key}
      Processing__CompletedThreshold: "0.75"
    volumes:
      - uploads:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://api:8080
      VITE_API_KEY: ${API_KEY:-dev-api-key}
    depends_on:
      - api

volumes:
  mongo-data:
  uploads: